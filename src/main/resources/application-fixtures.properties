# Dedicated, persistent demo database. Ordinary startup keeps data/guitarvault.
spring.datasource.url=jdbc:h2:file:./data/guitarvault-demo;DB_CLOSE_ON_EXIT=FALSE
server.port=8082
server.address=127.0.0.1
# Cookies are shared across ports on a host: give this instance its own session.
server.servlet.session.cookie.name=GUITARVAULT_DEMO_SESSION
app.base-url=${APP_BASE_URL:http://localhost:${server.port}}
app.fixtures.password=${FIXTURES_PASSWORD:DemoGuitar2026!}
