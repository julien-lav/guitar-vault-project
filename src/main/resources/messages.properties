# Permanent instrument passports and ownership transfers
transfer.title=Transferts d’instruments
transfer.new=Transférer mon instrument
transfer.detail=Proposition de transfert
transfer.inboxHint=Propositions envoyées et reçues. La propriété change uniquement après acceptation du destinataire.
transfer.empty=Aucune proposition de transfert.
transfer.sharing=Le destinataire voit d’abord votre pseudonyme et le nom, la marque, l’année et le numéro de série de l’instrument. L’acceptation conserve le même passeport et transmet les enregistrements, concerts et rapports professionnels, anciennes versions et corrections futures comprises. Notes personnelles, historique libre, texte de l’ancien propriétaire et photos restent privés à leur propriétaire d’origine. Les informations financières inscrites dans un rapport professionnel suivent ce rapport : vérifiez les rapports avant de proposer le transfert.
