mail.verify.body=Bonjour {0},\n\nBienvenue dans Guitar Vault !\n\nPour activer votre compte et confirmer votre adresse email, ouvrez ce lien :\n\n{1}\n\nCe lien est valable pendant 24 heures et ne peut être utilisé qu’une seule fois.\nVous pourrez ensuite vous connecter avec votre email et votre mot de passe.\n\nSi vous n’êtes pas à l’origine de cette inscription, ignorez cet email. Votre compte restera inactif.\n\nÀ bientôt,\nL’équipe Guitar Vault
