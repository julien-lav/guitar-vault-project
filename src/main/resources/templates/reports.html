<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="content" class="vault"><header class="page-header"><div><h1 th:text="#{report.mine}"></h1><p class="muted" th:text="#{report.privacy}"></p></div></header><div th:if="${error}" class="notice error" role="alert" th:text="${#messages.msg(error)}"></div><p class="panel muted" th:if="${reportPage.empty}" th:text="#{report.empty}"></p><ul class="report-list"><li class="panel report-row" th:each="report : ${reportPage.content}"><div><a th:href="@{/reports/{id}(id=${report.id})}" th:text="${report.targetLabel}"></a><p class="muted" th:text="${#messages.msg('report.reason.' + report.reason)}"></p></div><span class="badge" th:text="${#messages.msg('report.status.' + report.status)}"></span></li></ul><nav class="article-pagination" th:if="${reportPage.totalPages > 1}" th:aria-label="#{report.pages}"><a th:if="${reportPage.hasPrevious()}" th:href="@{/reports(page=${reportPage.number - 1})}" th:text="#{notification.previous}"></a><span th:text="#{notification.page(${reportPage.number + 1},${reportPage.totalPages})}"></span><a th:if="${reportPage.hasNext()}" th:href="@{/reports(page=${reportPage.number + 1})}" th:text="#{notification.next}"></a></nav></section>
</body></html>
