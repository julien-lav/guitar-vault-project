<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="fields" class="fields"><div><label for="shop-time" th:text="#{appointment.time}"></label><input id="shop-time" name="proposedTime" type="datetime-local" required th:value="${form['proposedTime']}"></div><div><label for="shop-zone" th:text="#{appointment.zone}"></label><input id="shop-zone" name="timeZone" list="shop-zones" required maxlength="80" th:value="${form['timeZone']}"><datalist id="shop-zones"><option th:each="zone : ${timeZones}" th:value="${zone}"></option></datalist></div><p class="field-wide" th:text="#{shop.bookingHint}"></p></div></body></html>
