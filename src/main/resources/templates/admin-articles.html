<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="content" class="vault journal" aria-labelledby="admin-articles-title">
    <div class="page-header"><div><p class="eyebrow" th:text="#{nav.admin}"></p><h1 id="admin-articles-title" th:text="#{article.manage}"></h1><p class="muted" th:text="#{article.adminIntro}"></p></div><a class="button" href="/admin/articles/new" th:text="#{article.new}"></a></div>
    <div th:if="${success}" class="notice success" role="status" th:text="${#messages.msg(success)}"></div>
    <div th:if="${error}" class="notice error" role="alert" th:text="${#messages.msg(error)}"></div>
    <p th:unless="${isAdmin}" class="notice preview-banner" th:text="#{article.editorScope}"></p>
    <div class="article-stats"><a class="panel" href="/admin/articles"><span th:text="#{article.total}"></span><strong th:text="${publishedCount + draftCount}"></strong></a><a th:if="${isAdmin}" class="panel" href="/admin/articles?state=published"><span th:text="#{article.publishedPlural}"></span><strong th:text="${publishedCount}"></strong></a><a class="panel" href="/admin/articles?state=draft"><span th:text="#{article.drafts}"></span><strong th:text="${draftCount}"></strong></a></div>
    <form class="article-filters panel" method="get" th:action="@{/admin/articles}">
        <div><label for="article-query" th:text="#{article.search}"></label><input id="article-query" type="search" name="q" maxlength="160" th:value="${q}"></div>
        <div th:if="${isAdmin}"><label for="article-state" th:text="#{article.state}"></label><select id="article-state" name="state"><option value="" th:text="#{article.allStates}"></option><option value="draft" th:selected="${state == 'draft'}" th:text="#{article.draft}"></option><option value="published" th:selected="${state == 'published'}" th:text="#{article.published}"></option></select></div>
        <div><label for="article-category" th:text="#{article.category}"></label><select id="article-category" name="category"><option value="" th:text="#{article.allCategories}"></option><option th:each="item : ${categories}" th:value="${item}" th:selected="${category == item}" th:text="${#messages.msg('article.category.' + item)}"></option></select></div>
        <button class="button" type="submit" th:text="#{article.filter}"></button><a href="/admin/articles" th:text="#{article.reset}"></a>
    </form>
    <p class="muted" role="status" th:text="#{articles.count(${articlePage.totalElements})}"></p>
    <div th:if="${articlePage.empty}" class="panel empty"><h2 th:text="#{articles.emptyTitle}"></h2><p class="muted" th:text="#{article.emptyAdmin}"></p><a href="/admin/articles/new" th:text="#{article.new}"></a></div>
    <div th:unless="${articlePage.empty}" class="panel table-scroll"><table>
        <caption class="sr-only" th:text="#{article.manage}"></caption><thead><tr><th scope="col" th:text="#{article.title}"></th><th scope="col" th:text="#{article.state}"></th><th scope="col" th:text="#{article.updated}"></th><th scope="col" th:text="#{article.actions}"></th></tr></thead>
        <tbody><tr th:each="article : ${articlePage.content}">
            <td><a th:href="@{/admin/articles/{id}/edit(id=${article.id})}" th:text="${article.title}"></a><small class="muted article-table-category" th:text="${#messages.msg('article.category.' + article.category)}"></small></td>
            <td><span class="badge" th:classappend="${article.published ? '' : 'repair'}" th:text="${#messages.msg(article.published ? 'article.published' : 'article.draft')}"></span></td>
            <td><time th:datetime="${article.updatedAt}" th:text="${#temporals.format(article.updatedAt, 'dd/MM/yyyy HH:mm', 'UTC')}"></time></td>
            <td><div class="article-row-actions">
                <a th:href="@{/admin/articles/{id}/edit(id=${article.id})}" th:text="#{article.edit}"></a>
                <a th:href="@{/admin/articles/{id}/preview(id=${article.id})}" th:text="#{article.preview}"></a>
                <form th:if="${isAdmin}" method="post" th:action="${'/admin/articles/' + article.id + (article.published ? '/unpublish' : '/publish')}"><input type="hidden" name="version" th:value="${article.version}"><button class="text-button" type="submit" th:text="${#messages.msg(article.published ? 'article.unpublish' : 'article.publish')}"></button></form>
                <a th:if="${isAdmin}" class="danger-link" th:href="@{/admin/articles/{id}/delete(id=${article.id})}" th:text="#{article.delete}"></a>
            </div></td>
        </tr></tbody>
    </table></div>
    <div th:if="${articlePage.totalPages > 1}" class="article-pagination" role="navigation" th:aria-label="#{article.pagination}">
        <a th:if="${articlePage.hasPrevious()}" th:href="@{/admin/articles(page=${articlePage.number - 1},q=${q},state=${state},category=${category})}" th:text="#{article.previous}"></a><span th:text="#{article.page(${articlePage.number + 1},${articlePage.totalPages})}"></span><a th:if="${articlePage.hasNext()}" th:href="@{/admin/articles(page=${articlePage.number + 1},q=${q},state=${state},category=${category})}" th:text="#{article.next}"></a>
    </div>
</section>
</body></html>
