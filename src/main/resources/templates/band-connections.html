<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="content" class="vault" aria-labelledby="connections-title">
    <header class="page-header"><div><h1 id="connections-title" th:text="#{connection.title}"></h1><p class="muted" th:text="#{connection.intro}"></p></div><a th:href="@{/bands}" th:text="#{band.discover}"></a></header>
    <div th:if="${success}" class="notice success" role="status" th:text="${#messages.msg(success)}"></div>
    <div th:if="${error}" class="notice error" role="alert" th:text="${#messages.msg(error)}"></div>
    <section class="panel band-section"><h2 th:text="#{connection.incoming}"></h2><p class="muted" th:if="${#lists.isEmpty(incomingConnections)}" th:text="#{connection.emptyIncoming}"></p><ul class="band-member-list"><li th:each="connection : ${incomingConnections}"><div th:replace="~{band-connections :: summary(${connection})}"></div><div th:replace="~{band-connections :: decisions(${connection})}"></div></li></ul></section>
    <section class="panel band-section"><h2 th:text="#{connection.outgoing}"></h2><p class="muted" th:if="${#lists.isEmpty(outgoingConnections)}" th:text="#{connection.emptyOutgoing}"></p><ul class="band-member-list"><li th:each="connection : ${outgoingConnections}"><div th:replace="~{band-connections :: summary(${connection})}"></div><form method="post" th:action="@{/band-connections/{id}/cancel(id=${connection.id})}"><button class="entry-remove" th:text="#{connection.cancel}"></button></form></li></ul></section>
    <section class="panel band-section"><h2 th:text="#{connection.accepted}"></h2><p class="muted" th:if="${#lists.isEmpty(acceptedConnections)}" th:text="#{connection.emptyAccepted}"></p><ul class="band-member-list"><li th:each="connection : ${acceptedConnections}"><div th:replace="~{band-connections :: summary(${connection})}"></div><a class="danger-link" th:href="@{/band-connections/{id}/remove(id=${connection.id})}" th:text="#{connection.remove}"></a></li></ul></section>
</section>
<div th:fragment="summary(connection)" class="connection-summary"><p><a th:href="@{/bands/{id}(id=${connection.sender.id})}" th:text="${connection.sender.name}"></a> → <a th:href="@{/bands/{id}(id=${connection.recipient.id})}" th:text="${connection.recipient.name}"></a></p><span class="badge" th:text="${#messages.msg('connection.type.' + connection.type)}"></span><div th:replace="~{band-connections :: concert(${connection})}"></div></div>
<p th:fragment="concert(connection)" class="muted connection-concert" th:if="${connection.playedOn != null or !#strings.isEmpty(connection.venue)}"><time th:if="${connection.playedOn != null}" th:datetime="${connection.playedOn}" th:text="${#temporals.format(connection.playedOn, 'dd/MM/yyyy')}"></time><span th:if="${connection.playedOn != null and !#strings.isEmpty(connection.venue)}"> · </span><span th:if="${!#strings.isEmpty(connection.venue)}" th:text="${connection.venue}"></span></p>
<div th:fragment="decisions(connection)" class="actions connection-actions"><form method="post" th:action="@{/band-connections/{id}/accept(id=${connection.id})}"><button class="button" th:text="#{connection.accept}"></button></form><form method="post" th:action="@{/band-connections/{id}/decline(id=${connection.id})}"><button class="button secondary-button" th:text="#{connection.decline}"></button></form></div>
<section th:fragment="network" id="band-network" class="panel band-section" aria-labelledby="network-title">
    <h2 id="network-title" th:text="#{connection.network}"></h2>
    <h3 th:text="#{connection.type.FRIEND}"></h3><p class="muted" th:if="${#lists.isEmpty(friendConnections)}" th:text="#{connection.noFriends}"></p>
    <ul class="band-member-list"><li th:each="connection : ${friendConnections}"><a th:href="@{/bands/{id}(id=${connection.other(band.id).id})}" th:text="${connection.other(band.id).name}"></a> <a class="button secondary-button" th:if="${canEditBand and connection.other(band.id).creator.id != band.creator.id and connection.other(band.id).creator.enabled}" th:href="@{/bands/{id}/date-proposals/new(id=${connection.other(band.id).id},senderId=${band.id})}" th:text="#{proposal.create}"></a></li></ul>
    <h3 th:text="#{connection.type.PLAYED_TOGETHER}"></h3><p class="muted" th:if="${#lists.isEmpty(playedConnections)}" th:text="#{connection.noConcerts}"></p>
    <ul class="band-member-list"><li th:each="connection : ${playedConnections}"><a th:href="@{/bands/{id}(id=${connection.other(band.id).id})}" th:text="${connection.other(band.id).name}"></a><div th:replace="~{band-connections :: concert(${connection})}"></div></li></ul>
    <div th:if="${canEditBand}"><h3 th:text="#{connection.pending}"></h3><p class="muted" th:if="${#lists.isEmpty(pendingConnections)}" th:text="#{connection.noPending}"></p><ul class="band-member-list"><li th:each="connection : ${pendingConnections}"><div th:replace="~{band-connections :: summary(${connection})}"></div><div th:if="${connection.recipient.id == band.id}" th:insert="~{band-connections :: decisions(${connection})}"></div><form th:if="${connection.sender.id == band.id}" method="post" th:action="@{/band-connections/{id}/cancel(id=${connection.id})}"><button class="entry-remove" th:text="#{connection.cancel}"></button></form></li></ul><a th:href="@{/band-connections}" th:text="#{connection.manage}"></a></div>
    <div th:unless="${#lists.isEmpty(networkBands)}">
        <h3 th:text="#{connection.requestTitle}"></h3><p class="field-hint" th:text="#{connection.consent}"></p>
        <form method="post" th:action="@{/bands/{id}/connections(id=${band.id})}" class="connection-form">
            <div class="fields"><div><label for="connection-sender" th:text="#{connection.sender}"></label><select id="connection-sender" name="senderId" required><option value="" th:text="#{connection.chooseBand}"></option><option th:each="owned : ${networkBands}" th:value="${owned.id}" th:selected="${owned.id.toString() == connectionForm['senderId']}" th:text="${owned.name}"></option></select></div>
            <div><label for="connection-type" th:text="#{connection.type}"></label><select id="connection-type" name="type" required><option value="FRIEND" th:selected="${connectionForm['type'] == 'FRIEND'}" th:text="#{connection.type.FRIEND}"></option><option value="PLAYED_TOGETHER" th:selected="${connectionForm['type'] == 'PLAYED_TOGETHER'}" th:text="#{connection.type.PLAYED_TOGETHER}"></option></select></div>
            <div><label for="connection-date" th:text="#{connection.date}"></label><input id="connection-date" type="date" name="playedOn" th:value="${connectionForm['playedOn']}"></div><div><label for="connection-venue" th:text="#{connection.venue}"></label><input id="connection-venue" name="venue" maxlength="200" th:value="${connectionForm['venue']}"></div></div>
            <p class="field-hint" th:text="#{connection.concertHint}"></p><button class="button" type="submit" th:text="#{connection.send}"></button>
        </form>
    </div>
    <p class="muted" th:if="${canEditBand}" th:text="#{connection.findOthers}"></p>
</section>
</body></html>
