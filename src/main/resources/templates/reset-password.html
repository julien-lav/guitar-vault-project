<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><title th:text="#{page.home}">Guitar Vault</title></head><body>
<section th:fragment="content" class="vault recovery" aria-labelledby="reset-title">
    <p class="eyebrow">GUITAR VAULT</p>
    <h1 id="reset-title" th:text="#{reset.heading}"></h1>
    <div th:unless="${validToken}" class="notice error" role="alert">
        <p th:text="#{reset.invalid}"></p>
        <a th:href="@{/forgot-password}" th:text="#{reset.requestNew}"></a>
    </div>
    <div th:if="${validToken}">
        <p class="muted" th:text="#{reset.intro}"></p>
        <div th:if="${error}" class="notice error" role="alert" th:text="${#messages.msg(error)}"></div>
        <form method="post" th:action="@{/reset-password}" class="panel">
            <input type="hidden" name="token" th:value="${token}" />
            <label for="password" th:text="#{field.password}"></label>
            <div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" pattern=".*[\p{P}\p{S}].*" required aria-describedby="password-help" /><button th:replace="~{password-toggle :: toggle('password')}"></button></div>
            <small id="password-help" th:text="#{password.help}"></small>
            <label for="confirmPassword" th:text="#{field.confirmPassword}"></label>
            <div class="password-field"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required /><button th:replace="~{password-toggle :: toggle('confirmPassword')}"></button></div>
            <button class="button" type="submit" th:text="#{reset.submit}"></button>
        </form>
    </div>
    <p><a th:href="@{/login}" th:text="#{forgot.back}"></a></p>
</section>
</body></html>
