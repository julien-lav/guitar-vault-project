<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="content" class="vault concert-detail" aria-labelledby="concert-heading">
    <a th:href="@{/bands/{id}(id=${concert.organizer.id})}" th:text="${concert.organizer.name}"></a>
    <header class="page-header"><div><p class="eyebrow" th:text="#{concert.label}"></p><h1 id="concert-heading" th:text="${concert.title}"></h1><span th:if="${concert.cancelled}" class="badge" th:text="#{concert.cancelled}"></span></div><div class="actions" th:if="${canManageConcert and !concert.cancelled}"><a class="button" th:href="@{/concerts/{id}/edit(id=${concert.id})}" th:text="#{concert.edit}"></a><a class="danger-link" th:href="@{/concerts/{id}/cancel(id=${concert.id})}" th:text="#{concert.cancel}"></a></div></header>
    <div th:if="${success}" class="notice success" role="status" th:text="${#messages.msg(success)}"></div><div th:if="${error}" class="notice error" role="alert" th:text="${#messages.msg(error)}"></div>
    <div th:each="participation : ${myConcertInvitations}" class="panel band-section"><p th:text="#{concert.invitedBand(${participation.band.name})}"></p><div th:replace="~{concert-invitations :: decisions(${participation})}"></div></div>
    <div class="concert-detail-grid" th:classappend="${!hasPoster ? 'concert-without-poster' : ''}"><div>
        <section class="panel band-section"><h2 th:text="#{concert.information}"></h2><dl class="profile-facts"><dt th:text="#{concert.date}"></dt><dd><time th:datetime="${concert.date}" th:text="${#temporals.format(concert.date, 'dd/MM/yyyy')}"></time></dd><dt th:text="#{concert.venue}"></dt><dd th:text="${concert.venue}"></dd><dt th:if="${!#strings.isEmpty(concert.city)}" th:text="#{concert.city}"></dt><dd th:if="${!#strings.isEmpty(concert.city)}" th:text="${concert.city}"></dd><dt th:text="#{concert.organizer}"></dt><dd><a th:href="@{/bands/{id}(id=${concert.organizer.id})}" th:text="${concert.organizer.name}"></a></dd></dl><p class="instrument-text" th:if="${!#strings.isEmpty(concert.description)}" th:text="${concert.description}"></p></section>
        <section class="panel band-section"><h2 th:text="#{concert.lineup}"></h2><ul class="band-member-list"><li><a th:href="@{/bands/{id}(id=${concert.organizer.id})}" th:text="${concert.organizer.name}"></a><span class="muted" th:text="#{concert.organizer}"></span></li><li th:each="participation : ${confirmedParticipants}" class="band-member-row"><a th:href="@{/bands/{id}(id=${participation.band.id})}" th:text="${participation.band.name}"></a><a th:if="${!concert.cancelled and (canManageConcert or participation.band.creator.id == actorId)}" class="danger-link" th:href="@{/concert-participations/{id}/remove(id=${participation.id})}" th:text="#{concert.remove}"></a></li></ul></section>
        <section class="panel band-section" th:if="${canManageConcert and !concert.cancelled}"><h2 th:text="#{concert.invite}"></h2><p class="field-hint" th:text="#{concert.consentHint}"></p><form th:if="${!#lists.isEmpty(inviteBands)}" method="post" th:action="@{/concerts/{id}/invitations(id=${concert.id})}" class="band-invite-form"><label for="invited-band" th:text="#{concert.chooseBand}"></label><select id="invited-band" name="bandId" required><option th:each="band : ${inviteBands}" th:value="${band.id}" th:text="${band.name}"></option></select><button class="button" type="submit" th:text="#{concert.invite}"></button></form><p class="muted" th:if="${#lists.isEmpty(inviteBands)}" th:text="#{concert.noInviteBands}"></p><h3 th:text="#{concert.pending}"></h3><p class="muted" th:if="${#lists.isEmpty(pendingParticipants)}" th:text="#{concert.noPending}"></p><ul class="band-member-list"><li th:each="participation : ${pendingParticipants}" class="band-member-row"><span th:text="${participation.band.name}"></span><a class="danger-link" th:href="@{/concert-participations/{id}/remove(id=${participation.id})}" th:text="#{concert.remove}"></a></li></ul></section>
    </div><aside th:if="${hasPoster}"><img class="concert-poster" th:src="@{/concerts/{id}/poster(id=${concert.id})}" th:alt="#{concert.posterAlt(${concert.title})}"></aside></div>
<p class="report-entry" th:if="${!canManageConcert}"><a th:replace="~{report-link :: link('CONCERT',${concert.id})}"></a></p>
</section>
</body></html>
