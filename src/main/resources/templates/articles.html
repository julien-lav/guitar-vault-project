<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="content" class="vault journal" aria-labelledby="journal-heading">
    <div class="page-header">
        <div><p class="eyebrow" th:text="#{articles.eyebrow}"></p><h1 id="journal-heading" th:text="#{articles.heading}"></h1><p class="muted" th:text="#{articles.intro}"></p></div>
        <a th:if="${canWriteArticles}" class="button" href="/admin/articles" th:text="#{article.manage}"></a>
    </div>
    <form class="article-filters panel" method="get" th:action="@{/articles}">
        <div><label for="article-query" th:text="#{article.search}"></label><input id="article-query" type="search" name="q" maxlength="160" th:value="${q}"></div>
        <div><label for="article-category" th:text="#{article.category}"></label><select id="article-category" name="category">
            <option value="" th:text="#{article.allCategories}"></option><option th:each="item : ${categories}" th:value="${item}" th:selected="${category == item}" th:text="${#messages.msg('article.category.' + item)}"></option>
        </select></div><button class="button" type="submit" th:text="#{article.filter}"></button>
        <a th:if="${!#strings.isEmpty(q) || !#strings.isEmpty(category)}" href="/articles" th:text="#{article.reset}"></a>
    </form>
    <p class="muted" role="status" th:text="#{articles.count(${articlePage.totalElements})}"></p>
    <div th:if="${articlePage.empty}" class="panel empty"><h2 th:text="#{articles.emptyTitle}"></h2><p class="muted" th:text="#{articles.emptySearch}"></p></div>
    <div class="article-grid" th:unless="${articlePage.empty}"><th:block th:each="article : ${articlePage.content}"><article th:replace="~{article-card :: card(${article})}"></article></th:block></div>
    <div th:if="${articlePage.totalPages > 1}" class="article-pagination" role="navigation" th:aria-label="#{article.pagination}">
        <a th:if="${articlePage.hasPrevious()}" th:href="@{/articles(page=${articlePage.number - 1},q=${q},category=${category})}" th:text="#{article.previous}"></a>
        <span th:text="#{article.page(${articlePage.number + 1},${articlePage.totalPages})}"></span>
        <a th:if="${articlePage.hasNext()}" th:href="@{/articles(page=${articlePage.number + 1},q=${q},category=${category})}" th:text="#{article.next}"></a>
    </div>
</section>
</body></html>
