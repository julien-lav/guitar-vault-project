<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${#messages.msg(title)}">Guitar Vault</title>
    <script th:src="@{/js/ui.js}" defer></script>
    <link rel="stylesheet" th:href="@{/css/vault.css}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f4f6;
            color: #111827;
        }
        nav {
            background: #111827;
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 16px;
            font-weight: bold;
        }
        nav { flex-wrap: wrap; gap: 16px; }
        nav form { display: inline; }
        nav button { background: transparent; color: white; border: 1px solid #9ca3af; border-radius: 6px; padding: 8px 12px; cursor: pointer; font: inherit; }
        .container {
            padding: 32px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
    </style>
</head>
<body>
    <nav>
        <div>
            <a href="/" th:text="#{page.home}">Guitar Vault</a>
            <a href="/dashboard" th:text="#{nav.dashboard}">Tableau de bord</a>
            <a href="/instruments" th:text="#{nav.instruments}">Mes instruments</a>
        </div>
        <div th:if="${currentUsername == null}">
            <a href="/signup" th:text="#{nav.signup}">Créer un compte</a>
            <a href="/login" th:text="#{nav.login}">Se connecter</a>
        </div>
        <div th:if="${currentUsername != null}">
            <span th:text="${currentUsername}"></span>
            <form method="post" th:action="@{/logout}">
                <button type="submit" th:text="#{nav.logout}">Se déconnecter</button>
            </form>
        </div>
        <details class="language-menu">
            <summary><span class="sr-only" th:text="#{language.label}"></span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 6.5h14M5 17.5h14"/></svg> <span th:text="${#locale.language == 'en' ? 'English' : 'Français'}"></span></summary>
            <div class="language-options" aria-label="Language / Langue">
                <a th:href="${languageUrls['fr']}" lang="fr" hreflang="fr" th:aria-current="${#locale.language == 'fr' ? 'true' : null}">Français</a>
                <a th:href="${languageUrls['en']}" lang="en" hreflang="en" th:aria-current="${#locale.language == 'en' ? 'true' : null}">English</a>
            </div>
        </details>
    </nav>

    <div class="container">
        <div class="card" th:replace="~{${contentTemplate} :: content}">
            Contenu
        </div>
    </div>
</body>
</html>
