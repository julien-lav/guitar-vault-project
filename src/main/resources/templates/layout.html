<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle != null ? pageTitle : #messages.msg(title)}">Guitar Vault</title>
    <meta th:if="${pageDescription != null}" name="description" th:content="${pageDescription}">
    <script th:src="@{/js/ui.js}" defer></script>
    <link rel="stylesheet" th:href="@{/css/vault.css}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f4f6;
            color: #111827;
        }
        nav {
            background: #111827;
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 16px;
            font-weight: bold;
        }
        nav { flex-wrap: wrap; gap: 16px; }
        nav form { display: inline; }
        nav button { background: transparent; color: white; border: 1px solid #9ca3af; border-radius: 6px; padding: 8px 12px; cursor: pointer; font: inherit; }
        .container {
            padding: 32px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content" th:text="#{nav.skip}"></a>
    <nav class="site-nav" th:aria-label="#{nav.main}">
        <a class="site-brand" th:href="@{/}">Guitar Vault</a>
        <div class="site-nav-primary">
            <details class="nav-menu" th:if="${currentUsername != null}">
                <summary th:text="#{nav.mySpace}"></summary>
                <div class="nav-dropdown">
                    <a th:href="@{/dashboard}" th:aria-current="${currentPath == '/dashboard' ? 'page' : null}" th:text="#{nav.dashboard}"></a>
                    <a th:href="@{/profile}" th:aria-current="${currentPath == '/profile/edit' ? 'page' : null}" th:text="#{nav.profile}"></a>
                    <a th:href="@{/instruments}" th:aria-current="${currentPath == '/instruments' ? 'page' : null}" th:text="#{nav.instruments}"></a>
                    <a th:href="@{/wishlist}" th:aria-current="${currentPath == '/wishlist' ? 'page' : null}" th:text="#{nav.wishlist}"></a>
                    <a th:href="@{/dashboard#dashboard-bands}" th:text="#{band.mine}"></a>
                    <a th:href="@{/dashboard#dashboard-studios}" th:text="#{studio.mine}"></a>
                    <a th:href="@{/invitations}" th:aria-current="${currentPath == '/invitations' ? 'page' : null}" th:text="#{nav.invitations}"></a>
                    <a th:href="@{/concert-invitations}" th:aria-current="${currentPath == '/concert-invitations' ? 'page' : null}" th:text="#{concert.invitations}"></a>
                    <a th:href="@{/band-connections}" th:aria-current="${currentPath == '/band-connections' ? 'page' : null}" th:text="#{connection.title}"></a>
                    <a th:href="@{/reports}" th:text="#{report.mine}"></a>
                    <a th:href="@{/quotes}" th:aria-current="${currentPath == '/quotes' ? 'page' : null}" th:text="#{nav.quotes}"></a>
                </div>
            </details>
            <details class="nav-menu">
                <summary th:text="#{nav.discover}"></summary>
                <div class="nav-dropdown">
                    <a th:href="@{/articles}" th:aria-current="${currentPath == '/articles' ? 'page' : null}" th:text="#{nav.articles}"></a>
                    <a th:href="@{/studios}" th:aria-current="${currentPath == '/studios' ? 'page' : null}" th:text="#{nav.studios}"></a>
                    <a th:href="@{/bands}" th:aria-current="${currentPath == '/bands' ? 'page' : null}" th:text="#{nav.bands}"></a>
                </div>
            </details>
            <a th:if="${isAdmin}" th:href="@{/admin/moderation}" th:text="#{report.moderation}"></a>
            <a th:if="${canWriteArticles}" th:href="@{/admin/articles}" th:text="#{nav.admin}"></a>
        </div>
        <div class="nav-actions">
            <a class="notification-bell" th:if="${currentUsername != null}" th:href="@{/notifications}" th:aria-label="#{notification.bell(${unreadNotificationCount})}" th:aria-current="${currentPath == '/notifications' ? 'page' : null}" data-notification-bell th:attr="data-unread=${unreadNotificationCount},data-notification-label=#{notification.bellPattern}">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
                <span class="notification-count" data-notification-count aria-hidden="true" th:attr="hidden=${unreadNotificationCount == 0 ? 'hidden' : null}" th:text="${unreadNotificationCount > 99 ? '99+' : unreadNotificationCount}"></span>
                <span class="sr-only" data-notification-announcement role="status" aria-live="polite"></span>
            </a>
            <div class="nav-account" th:if="${currentUsername == null}"><a th:href="@{/signup}" th:text="#{nav.signup}"></a><a th:href="@{/login}" th:text="#{nav.login}"></a></div>
            <div class="nav-account" th:if="${currentUsername != null}"><span class="nav-username" th:text="${currentUsername}"></span><form method="post" th:action="@{/logout}"><button type="submit" th:text="#{nav.logout}"></button></form></div>
            <details class="language-menu">
                <summary><span class="sr-only" th:text="#{language.label}"></span><span class="language-flag" aria-hidden="true" th:text="${#locale.language == 'en' ? '🇬🇧' : '🇫🇷'}">🇫🇷</span> <span th:text="${#locale.language == 'en' ? 'English' : 'Français'}"></span></summary>
                <div class="language-options" aria-label="Language / Langue">
                    <a th:href="${languageUrls['fr']}" lang="fr" hreflang="fr" th:aria-current="${#locale.language == 'fr' ? 'true' : null}">Français</a>
                    <a th:href="${languageUrls['en']}" lang="en" hreflang="en" th:aria-current="${#locale.language == 'en' ? 'true' : null}">English</a>
                </div>
            </details>
        </div>
    </nav>

    <main class="container" id="main-content" tabindex="-1">
        <div class="card" th:replace="~{${contentTemplate} :: content}">
            Contenu
        </div>
    </main>
</body>
</html>
