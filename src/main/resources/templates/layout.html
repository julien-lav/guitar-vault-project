<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="fr" data-theme="vault">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${pageTitle != null ? pageTitle : #messages.msg(title)}">Guitar Vault</title>
<meta th:if="${pageDescription != null}" name="description" th:content="${pageDescription}">
<script th:src="@{/js/ui.js}" defer></script><link rel="stylesheet" th:href="@{/css/app.css}">
</head><body th:classappend="${currentUsername != null ? 'has-workspace' : 'public-site'}">
<a class="skip-link" href="#main-content" th:text="#{nav.skip}"></a>
<nav class="site-nav" th:aria-label="#{nav.main}">
    <a class="site-brand" th:href="${currentUsername != null ? '/dashboard' : '/'}"><span class="brand-mark"><svg th:replace="~{ui :: icon('guitar')}"></svg></span><span>Guitar Vault<small th:text="#{ui.brandLine}"></small></span></a>
    <div class="site-nav-primary">
        <details class="nav-menu"><summary><span th:text="#{nav.discover}"></span></summary><div class="nav-dropdown">
            <a th:href="@{/shops}" th:text="#{shop.directory}"></a><a th:href="@{/luthiers}" th:text="#{luthier.directory}"></a><a th:href="@{/studios}" th:text="#{nav.studios}"></a><a th:href="@{/bands}" th:text="#{nav.bands}"></a><a th:href="@{/articles}" th:text="#{nav.articles}"></a>
        </div></details>
        <a class="header-help" th:href="@{/help}" th:aria-current="${currentPath.startsWith('/help') ? 'page' : null}" th:text="#{help.title}"></a>
    </div>
    <div class="nav-actions">
        <a class="notification-bell header-icon" th:if="${currentUsername != null}" th:href="@{/notifications}" th:aria-label="#{notification.bell(${unreadNotificationCount})}" th:aria-current="${currentPath == '/notifications' ? 'page' : null}" data-notification-bell th:attr="data-unread=${unreadNotificationCount},data-notification-label=#{notification.bellPattern}"><svg th:replace="~{ui :: icon('bell')}"></svg><span class="notification-count" data-notification-count aria-hidden="true" th:attr="hidden=${unreadNotificationCount == 0 ? 'hidden' : null}" th:text="${unreadNotificationCount > 99 ? '99+' : unreadNotificationCount}"></span><span class="sr-only" data-notification-announcement role="status" aria-live="polite"></span></a>
        <div class="nav-account" th:if="${currentUsername == null}"><a th:href="@{/login}" th:text="#{nav.login}"></a><a class="ui:dui-btn ui:dui-btn-primary ui:dui-btn-sm" th:href="@{/signup}" th:text="#{nav.signup}"></a></div>
        <details class="language-menu"><summary><span class="sr-only" th:text="#{language.label}"></span><span aria-hidden="true" th:text="${#locale.language == 'en' ? 'EN' : 'FR'}"></span></summary><div class="language-options"><a th:href="${languageUrls['fr']}" lang="fr" hreflang="fr" th:aria-current="${#locale.language == 'fr' ? 'true' : null}">Français</a><a th:href="${languageUrls['en']}" lang="en" hreflang="en" th:aria-current="${#locale.language == 'en' ? 'true' : null}">English</a></div></details>
        <details class="nav-menu account-menu" th:if="${currentUsername != null}"><summary class="header-icon"><svg th:replace="~{ui :: icon('user')}"></svg><span class="sr-only" th:text="#{ui.account}"></span></summary><div class="nav-dropdown"><p class="account-email" th:text="${currentUsername}"></p><a th:href="@{/profile}" th:text="#{nav.profile}"></a><a th:href="@{/profile/edit}" th:text="#{profile.edit}"></a><a th:href="@{/reports}" th:text="#{report.mine}"></a><form method="post" th:action="@{/logout}"><button type="submit" th:text="#{nav.logout}"></button></form></div></details>
    </div>
</nav>
<aside class="workspace-sidebar" th:if="${currentUsername != null}">
    <details class="workspace-nav" open data-workspace-nav><summary><svg th:replace="~{ui :: icon('menu')}"></svg><span th:text="#{nav.mySpace}"></span><svg th:replace="~{ui :: icon('chevron')}"></svg></summary>
    <nav class="workspace-links" th:aria-label="#{ui.workspaceNavigation}">
        <p class="v-nav-heading" th:text="#{ui.yourVault}"></p>
        <a th:replace="~{ui :: navLink('/dashboard','grid','nav.dashboard',${currentPath == '/dashboard'})}"></a>
        <a th:replace="~{ui :: navLink('/instruments','guitar','collection.label',${currentPath.startsWith('/instruments')})}"></a>
        <a th:replace="~{ui :: navLink('/documents','document','document.mine',${currentPath.startsWith('/documents')})}"></a>
        <a th:replace="~{ui :: navLink('/wishlist','heart','nav.wishlist',${currentPath.startsWith('/wishlist')})}"></a>
        <a th:replace="~{ui :: navLink('/transfers','transfer','transfer.title',${currentPath.startsWith('/transfers')})}"></a>
        <p class="v-nav-heading" th:text="#{ui.activity}"></p>
        <a th:replace="~{ui :: navLink('/notifications','message','ui.inbox',${currentPath.startsWith('/notifications')})}"></a>
        <details class="sidebar-group" th:open="${currentPath.startsWith('/appointments') or currentPath.startsWith('/shop-conversations')}"><summary><svg th:replace="~{ui :: icon('calendar')}"></svg><span th:text="#{ui.visits}"></span></summary><div class="sidebar-submenu"><a th:href="@{/appointments}" th:text="#{ui.workshopVisits}"></a><a th:href="@{/shop-conversations}" th:text="#{ui.shopVisits}"></a></div></details>
        <a th:replace="~{ui :: navLink('/interventions','tools','luthier.interventions',${currentPath.startsWith('/interventions')})}"></a>
        <p class="v-nav-heading" th:text="#{ui.workspaces}"></p>
        <details class="sidebar-group" th:open="${currentPath.startsWith('/my-shop') or currentPath.startsWith('/workshop')}"><summary><svg th:replace="~{ui :: icon('shop')}"></svg><span th:text="#{ui.professionalTools}"></span></summary><div class="sidebar-submenu"><a th:href="@{/my-shop}" th:text="#{shop.mine}"></a><a th:href="@{/workshop}" th:text="#{luthier.workshop}"></a><a th:href="@{/dashboard#dashboard-studios}" th:text="#{studio.mine}"></a><a th:href="@{/quotes}" th:text="#{nav.quotes}"></a></div></details>
        <details class="sidebar-group"><summary><svg th:replace="~{ui :: icon('music')}"></svg><span th:text="#{ui.musicProjects}"></span></summary><div class="sidebar-submenu"><a th:href="@{/dashboard#dashboard-bands}" th:text="#{band.mine}"></a><a th:href="@{/invitations}" th:text="#{nav.invitations}"></a><a th:href="@{/concert-invitations}" th:text="#{concert.invitations}"></a><a th:href="@{/date-proposals}" th:text="#{proposal.title}"></a><a th:href="@{/band-connections}" th:text="#{connection.title}"></a></div></details>
        <div class="sidebar-admin" th:if="${isAdmin or canWriteArticles}"><p class="v-nav-heading" th:text="#{ui.administration}"></p><a th:if="${canWriteArticles}" th:href="@{/admin/articles}" th:text="#{nav.admin}"></a><a th:if="${isAdmin}" th:href="@{/admin/luthiers}" th:text="#{luthier.review}"></a><a th:if="${isAdmin}" th:href="@{/admin/moderation}" th:text="#{report.moderation}"></a></div>
        <p class="sidebar-privacy"><svg th:replace="~{ui :: icon('lock')}"></svg><span th:text="#{ui.privateDefault}"></span></p>
    </nav></details>
</aside>
<main class="container app-content" id="main-content" tabindex="-1"><div th:replace="~{${contentTemplate} :: content}"></div><footer class="app-footer"><span>Guitar Vault</span><span th:text="#{ui.footer}"></span></footer></main>
</body></html>
