<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="content" class="vault" aria-labelledby="invitations-title">
    <header class="page-header"><div><p class="eyebrow" th:text="#{band.community}"></p><h1 id="invitations-title" th:text="#{nav.invitations}"></h1><p class="muted" th:text="#{invitation.intro}"></p></div><a class="button" th:href="@{/bands}" th:text="#{nav.bands}"></a></header>
    <div th:if="${success}" class="notice success" role="status" th:text="${#messages.msg(success)}"></div><div th:if="${error}" class="notice error" role="alert" th:text="${#messages.msg(error)}"></div>
    <section class="panel band-section" aria-labelledby="received-invitations"><h2 id="received-invitations" th:text="#{invitation.received}"></h2><p class="muted" th:if="${#lists.isEmpty(received)}" th:text="#{invitation.emptyReceived}"></p><ul class="band-member-list"><li th:each="invitation : ${received}"><div class="panel-heading"><div><a th:href="@{/bands/{id}(id=${invitation.band.id})}" th:text="${invitation.band.name}"></a><p class="muted" th:text="#{invitation.from(${invitation.band.creator.username})}"></p></div><div th:replace="~{band-invitations :: decision(${invitation})}"></div></div></li></ul></section>
    <section class="panel band-section" aria-labelledby="sent-invitations"><h2 id="sent-invitations" th:text="#{invitation.pendingSent}"></h2><p class="muted" th:if="${#lists.isEmpty(sent)}" th:text="#{invitation.emptySent}"></p><ul class="band-member-list"><li th:each="invitation : ${sent}" class="band-member-row"><div><a th:href="@{/bands/{id}(id=${invitation.band.id})}" th:text="${invitation.band.name}"></a><p class="muted" th:text="${'@' + invitation.invitee.username}"></p></div><form method="post" th:action="@{/invitations/{id}/cancel(id=${invitation.id})}"><button class="entry-remove" type="submit" th:text="#{invitation.cancel}"></button></form></li></ul></section>
</section>
<div th:fragment="decision(invitation)" class="actions invitation-actions"><form method="post" th:action="@{/invitations/{id}/accept(id=${invitation.id})}"><button class="button" type="submit" th:text="#{invitation.accept}"></button></form><form method="post" th:action="@{/invitations/{id}/decline(id=${invitation.id})}"><button class="entry-remove" type="submit" th:text="#{invitation.decline}"></button></form></div>
</body></html>
