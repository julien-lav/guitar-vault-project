<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="content" class="vault report-editor"><a th:href="@{/reports}" th:text="#{report.mine}"></a><header class="page-header"><h1 th:text="#{report.detail}"></h1></header><div th:if="${success}" class="notice success" role="status" th:text="${#messages.msg(success)}"></div><section class="panel"><h2 th:text="${report.targetLabel}"></h2><dl class="profile-facts"><dt th:text="#{report.state}"></dt><dd th:text="${#messages.msg('report.status.' + report.status)}"></dd><dt th:text="#{report.reason}"></dt><dd th:text="${#messages.msg('report.reason.' + report.reason)}"></dd><dt th:text="#{report.created}"></dt><dd th:text="${#temporals.format(report.createdDateTime, 'dd/MM/yyyy HH:mm') + ' UTC'}"></dd><dt th:text="#{report.decision}"></dt><dd th:text="${#messages.msg('report.decision.' + report.decision)}"></dd></dl><p class="instrument-text" th:text="${report.explanation}"></p><p class="field-hint" th:text="#{report.privacy}"></p></section></section>
</body></html>
