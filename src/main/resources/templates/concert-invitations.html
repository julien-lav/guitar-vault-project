<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="content" class="vault" aria-labelledby="concert-invitations-title"><header class="page-header"><h1 id="concert-invitations-title" th:text="#{concert.invitations}"></h1></header><div th:if="${error}" class="notice error" role="alert" th:text="${#messages.msg(error)}"></div><p class="panel muted" th:if="${#lists.isEmpty(concertInvitations)}" th:text="#{concert.noInvitations}"></p><ul class="concert-list"><li th:each="participation : ${concertInvitations}" class="panel band-section"><h2><a th:href="@{/concerts/{id}(id=${participation.concert.id})}" th:text="${participation.concert.title}"></a></h2><p th:text="#{concert.invitedBand(${participation.band.name})}"></p><p><time th:text="${#temporals.format(participation.concert.date, 'dd/MM/yyyy')}"></time> · <span th:text="${participation.concert.venue}"></span></p><div th:replace="~{concert-invitations :: decisions(${participation})}"></div></li></ul></section>
<div th:fragment="decisions(participation)" class="actions connection-actions"><form method="post" th:action="@{/concert-participations/{id}/accept(id=${participation.id})}"><button class="button" th:text="#{connection.accept}"></button></form><form method="post" th:action="@{/concert-participations/{id}/decline(id=${participation.id})}"><button class="button secondary-button" th:text="#{connection.decline}"></button></form></div>
</body></html>
