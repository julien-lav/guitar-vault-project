<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="content" class="vault report-editor" aria-labelledby="proposal-title">
    <a th:href="@{/date-proposals}" th:text="#{proposal.title}"></a>
    <header class="page-header"><div><h1 id="proposal-title" th:text="${proposal.sender.name + ' ↔ ' + proposal.recipient.name}"></h1><span class="badge" th:text="${#messages.msg('proposal.status.' + proposal.status)}"></span></div></header>
    <div th:if="${success}" class="notice success" role="status" th:text="${#messages.msg(success)}"></div><div th:if="${error}" class="notice error" role="alert" th:text="${#messages.msg(error)}"></div>
    <section class="panel band-section"><h2 th:text="#{proposal.current}"></h2><p><strong><time th:datetime="${proposal.proposedDate}" th:text="${#temporals.format(proposal.proposedDate, 'dd/MM/yyyy')}"></time></strong> · <span th:text="${#strings.isEmpty(proposal.venue) ? #messages.msg('proposal.venuePending') : proposal.venue}"></span></p><p class="instrument-text" th:text="${proposal.message}"></p><p class="field-hint" th:if="${proposal.status.name() == 'PENDING'}" th:text="#{proposal.awaiting(${proposal.responder.name})}"></p>
        <div th:if="${proposal.status.name() == 'ACCEPTED'}"><p th:text="#{proposal.acceptedHint}"></p><a th:href="@{/bands/{id}(id=${ownBand.id})}" th:text="#{proposal.openBand}"></a></div><p class="instrument-text" th:if="${!#strings.isEmpty(proposal.decisionMessage)}" th:text="${proposal.decisionMessage}"></p>
    </section>
    <section class="panel band-section" th:if="${canRespond}"><h2 th:text="#{proposal.respond}"></h2><p class="field-hint" th:unless="${canAgree}" th:text="#{proposal.inactiveError}"></p>
        <form method="post" th:action="@{/date-proposals/{id}/decline(id=${proposal.id})}"><input type="hidden" name="revision" th:value="${proposal.revision}"><label for="decision-message" th:text="#{proposal.reply}"></label><textarea id="decision-message" name="message" maxlength="2000" rows="3"></textarea><div class="actions"><button th:if="${canAgree}" class="button" th:formaction="@{/date-proposals/{id}/accept(id=${proposal.id})}" th:text="#{proposal.accept}"></button><button class="button secondary-button" th:text="#{proposal.decline}"></button></div></form>
        <details th:if="${canAgree}" th:open="${error != null}" class="band-section"><summary th:text="#{proposal.counter}"></summary><form method="post" th:action="@{/date-proposals/{id}/counter(id=${proposal.id})}"><input type="hidden" name="revision" th:value="${proposal.revision}"><div th:replace="~{date-proposal-form :: fields}"></div><button class="button" th:text="#{proposal.sendCounter}"></button></form></details>
    </section>
    <form th:if="${canCancel}" class="panel band-section" method="post" th:action="@{/date-proposals/{id}/cancel(id=${proposal.id})}"><input type="hidden" name="revision" th:value="${proposal.revision}"><button class="entry-remove" th:text="#{proposal.cancel}"></button></form>
    <section class="panel"><h2 th:text="#{proposal.history}"></h2><ol class="report-audit"><li th:each="entry : ${history}"><p><strong th:text="${entry.band.name}"></strong> · <time th:text="${#temporals.format(entry.createdDateTime, 'dd/MM/yyyy HH:mm') + ' UTC'}"></time></p><p><time th:text="${#temporals.format(entry.proposedDate, 'dd/MM/yyyy')}"></time><span th:if="${!#strings.isEmpty(entry.venue)}" th:text="${' · ' + entry.venue}"></span></p><p class="instrument-text" th:text="${entry.message}"></p></li></ol></section>
</section>
</body></html>
