<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title th:text="#{instrument.addTitle}">Ajouter un instrument</title></head>
<body>
<section th:fragment="content" class="vault instrument-editor" aria-labelledby="new-instrument-title">
    <a class="editor-back" th:href="@{/instruments}"><span aria-hidden="true">←</span> <span th:text="#{instrument.back}"></span></a>
    <header class="editor-heading">
        <p class="eyebrow" th:text="#{collection.label}"></p>
        <h1 id="new-instrument-title" th:text="#{instrument.addTitle}"></h1>
        <p class="muted" th:text="#{instrument.editorIntro}"></p>
    </header>
    <div th:if="${error}" class="notice error" role="alert" tabindex="-1" data-form-error th:text="${#messages.msg(error)}"></div>
    <form class="instrument-editor-grid" method="post" enctype="multipart/form-data" th:action="@{/instruments}">
        <aside class="editor-sidebar" th:aria-label="#{instrument.overview}">
            <div class="instrument-cover">
                <span class="cover-icon" aria-hidden="true"><svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m29 18 9-9 3 3-9 9M36 11l-2-2m5 7 2 2M28 19c-4-4-8-1-8 3 0 2-2 3-4 3-5-1-9 3-8 8 1 6 8 10 13 6 3-2 4-5 3-8 0-2 1-3 3-3 5 0 6-6 2-9Z"/><circle cx="19" cy="31" r="3"/><path d="m17 33 20-21m-25 23 4 4"/></svg></span>
                <p class="cover-kicker" th:text="#{instrument.newChapter}"></p>
                <p class="cover-name" data-instrument-name th:text="#{instrument.yourInstrument}" th:attr="data-fallback=#{instrument.yourInstrument}"></p>
                <p class="cover-brand" data-instrument-brand th:text="#{instrument.brandSummary}" th:attr="data-fallback=#{instrument.brandSummary}"></p>
            </div>
            <ol class="editor-outline">
                <li><a href="#instrument-info"><span>01</span><span th:text="#{instrument.identity}"></span></a></li>
                <li><a href="#instrument-photos"><span>02</span><span th:text="#{instrument.photos}"></span></a></li>
                <li><a href="#instrument-story"><span>03</span><span th:text="#{instrument.history}"></span></a></li>
                <li><a href="#instrument-music"><span>04</span><span th:text="#{instrument.musicalLife}"></span></a></li>
            </ol>
            <p class="editor-tip" th:text="#{instrument.optionalHint}"></p>
        </aside>
        <div class="editor-main">
            <section class="editor-card" id="instrument-info" aria-labelledby="identity-heading">
                <header class="editor-card-heading"><span class="section-number" aria-hidden="true">01</span><div><h2 id="identity-heading" th:text="#{instrument.identity}"></h2><p class="muted" th:text="#{instrument.identityHint}"></p></div></header>
                <div class="fields">
                    <div>
                        <label for="name"><span th:text="#{field.model}"></span> <span class="field-required" th:text="#{instrument.required}"></span></label>
                        <input id="name" name="name" maxlength="100" required th:placeholder="#{instrument.modelPlaceholder}" th:value="${form['name']}" />
                    </div>
                    <div>
                        <label for="brand"><span th:text="#{field.brand}"></span> <span class="field-required" th:text="#{instrument.required}"></span></label>
                        <input id="brand" name="brand" maxlength="100" required th:placeholder="#{instrument.brandPlaceholder}" th:value="${form['brand']}" />
                    </div>
                    <div>
                        <label for="year" th:text="#{field.year}"></label>
                        <input id="year" name="year" type="number" min="1" th:max="${currentYear}" placeholder="1987" th:value="${form['year']}" />
                    </div>
                    <div>
                        <label for="status" th:text="#{field.status}"></label>
                        <select id="status" name="status" required>
                            <option th:each="option : ${ {'Actif', 'À réparer', 'En vente'} }" th:value="${option}" th:text="${#messages.msg(optionKeys.get(option))}" th:selected="${form['status'] == option}"></option>
                        </select>
                    </div>
                    <div class="field-wide">
                        <label for="serialNumber" th:text="#{instrument.serialNumber}"></label>
                        <input id="serialNumber" name="serialNumber" type="text" maxlength="100" th:placeholder="#{instrument.serialPlaceholder}" th:value="${form['serialNumber']}" aria-describedby="serial-help" />
                        <p class="field-hint" id="serial-help" th:text="#{instrument.serialHint}"></p>
                    </div>
                </div>
            </section>
            <section class="editor-card photo-uploader" id="instrument-photos" aria-labelledby="photos-heading">
                <header class="editor-card-heading"><span class="section-number" aria-hidden="true">02</span><div><h2 id="photos-heading" th:text="#{instrument.photos}"></h2><p class="muted" th:text="#{instrument.photoIntro}"></p></div></header>
                <label class="upload-dropzone" for="photos">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 3-3 5 5"/></svg>
                    <span class="upload-title" th:text="#{instrument.choosePhotos}"></span>
                    <span class="upload-drag-hint" data-upload-drag hidden th:text="#{instrument.dropPhotos}"></span>
                    <span class="upload-format" th:text="#{instrument.photoFormats}"></span>
                    <input id="photos" name="photos" type="file" accept="image/jpeg,image/png" multiple aria-describedby="photos-help photos-error" />
                </label>
                <p class="field-hint" id="photos-help" th:text="#{instrument.photosHint}"></p>
                <p class="upload-error" id="photos-error" role="status" th:attr="data-message=#{instrument.uploadError}" hidden></p>
                <div class="photo-preview" id="photo-preview" aria-live="polite" th:attr="data-remove-label=#{instrument.removePhoto}"></div>
                <template id="photo-template"><figure class="photo-tile"><img alt="" /><figcaption></figcaption><button type="button" class="photo-remove">×</button></figure></template>
            </section>
            <section class="editor-card" id="instrument-story" aria-labelledby="story-heading">
                <header class="editor-card-heading"><span class="section-number" aria-hidden="true">03</span><div><h2 id="story-heading" th:text="#{instrument.history}"></h2><p class="muted" th:text="#{instrument.storyIntro}"></p></div></header>
                <div class="editor-field">
                    <label for="previousOwner" th:text="#{instrument.previousOwner}"></label>
                    <input id="previousOwner" name="previousOwner" type="text" maxlength="200" th:placeholder="#{instrument.ownerPlaceholder}" th:value="${form['previousOwner']}" />
                </div>
                <div class="editor-field">
                    <label for="history" th:text="#{instrument.storyLabel}"></label>
                    <textarea id="history" name="history" rows="5" maxlength="10000" th:placeholder="#{instrument.historyPlaceholder}" th:text="${form['history']}" data-character-count aria-describedby="history-count"></textarea>
                    <span class="character-count" id="history-count" data-count-for="history"></span>
                </div>
                <div class="editor-field">
                    <label for="notes" th:text="#{instrument.notes}"></label>
                    <textarea id="notes" name="notes" rows="3" maxlength="5000" th:placeholder="#{instrument.notesPlaceholder}" th:text="${form['notes']}" data-character-count aria-describedby="notes-count"></textarea>
                    <span class="character-count" id="notes-count" data-count-for="notes"></span>
                </div>
            </section>
            <section class="editor-card" id="instrument-music" aria-labelledby="music-heading">
                <header class="editor-card-heading"><span class="section-number" aria-hidden="true">04</span><div><h2 id="music-heading" th:text="#{instrument.musicalLife}"></h2><p class="muted" th:text="#{instrument.musicIntro}"></p></div></header>
                <div class="music-lists">
        <fieldset class="repeatable music-list" data-repeatable>
            <legend th:text="#{instrument.recordings}"></legend>
            <p class="muted" th:text="#{instrument.recordingsHint}"></p>
            <div data-entries>
                <div class="entry-row" th:each="entry, row : ${recordings}">
                    <label class="sr-only" th:for="${'recordings-' + row.index}" th:text="#{instrument.recordings}"></label>
                    <input name="recordings" maxlength="500" th:id="${'recordings-' + row.index}" th:value="${entry}" th:placeholder="#{instrument.recordingsPlaceholder}" />
                    <button class="entry-remove" type="button" data-remove th:aria-label="#{instrument.remove}" hidden>×</button>
                </div>
            </div>
            <template>
                <div class="entry-row">
                    <label class="sr-only" th:text="#{instrument.recordings}"></label>
                    <input name="recordings" maxlength="500" th:placeholder="#{instrument.recordingsPlaceholder}" />
                    <button class="entry-remove" type="button" data-remove th:aria-label="#{instrument.remove}">×</button>
                </div>
            </template>
            <button class="entry-add" type="button" data-add hidden th:text="#{instrument.recordingsAdd}"></button>
        </fieldset>
        <fieldset class="repeatable music-list" data-repeatable>
            <legend th:text="#{instrument.concerts}"></legend>
            <p class="muted" th:text="#{instrument.concertsHint}"></p>
            <div data-entries>
                <div class="entry-row" th:each="entry, row : ${concerts}">
                    <label class="sr-only" th:for="${'concerts-' + row.index}" th:text="#{instrument.concerts}"></label>
                    <input name="concerts" maxlength="500" th:id="${'concerts-' + row.index}" th:value="${entry}" th:placeholder="#{instrument.concertsPlaceholder}" />
                    <button class="entry-remove" type="button" data-remove th:aria-label="#{instrument.remove}" hidden>×</button>
                </div>
            </div>
            <template>
                <div class="entry-row">
                    <label class="sr-only" th:text="#{instrument.concerts}"></label>
                    <input name="concerts" maxlength="500" th:placeholder="#{instrument.concertsPlaceholder}" />
                    <button class="entry-remove" type="button" data-remove th:aria-label="#{instrument.remove}">×</button>
                </div>
            </template>
            <button class="entry-add" type="button" data-add hidden th:text="#{instrument.concertsAdd}"></button>
        </fieldset>
                </div>
            </section>
            <div class="editor-save-bar">
                <span class="save-hint" th:text="#{instrument.saveHint}"></span>
                <div class="actions"><a th:href="@{/instruments}" th:text="#{common.cancel}"></a><button class="button" type="submit" th:text="#{instrument.save}"></button></div>
            </div>
        </div>
    </form>
</section>
</body>
</html>
