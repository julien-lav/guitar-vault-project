<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="content" class="vault luthier-page">
<a th:href="@{/instruments/{id}(id=${instrument.id})}" th:text="${instrument.name}"></a><header class="page-header"><h1 th:text="#{transfer.reports}"></h1></header><p class="notice" th:text="#{transfer.reportHint}"></p><p th:if="${#lists.isEmpty(reports)}" th:text="#{luthier.noAssessment}"></p>
<article class="panel" th:each="report : ${reports}"><h2><span th:text="${report.workshopName}"></span> · <span th:text="#{luthier.revision}"></span> <span th:text="${report.revision}"></span></h2><p><strong th:text="${#messages.msg(currentReportIds.contains(report.id) ? 'luthier.current' : 'luthier.superseded')}"></strong> · <span th:text="#{luthier.intervention}"></span> #<span th:text="${report.intervention.id}"></span></p><p><span th:text="${report.authorName}"></span> · <time th:text="${report.recordedAt}"></time></p><p th:text="${#messages.msg(report.professionalVerified ? 'luthier.verifiedAtSigning' : 'luthier.unverifiedAtSigning')}"></p><dl><dt th:text="#{luthier.examinedOn}"></dt><dd th:text="${report.examinedOn}"></dd><dt th:text="#{luthier.conclusion}"></dt><dd th:text="${#messages.msg('luthier.conclusion.' + report.conclusion)}"></dd><dt th:text="#{luthier.findings}"></dt><dd class="instrument-text" th:text="${report.findings}"></dd><dt th:text="#{luthier.evidence}"></dt><dd class="instrument-text" th:text="${report.evidence}"></dd><dt th:text="#{luthier.limitations}"></dt><dd class="instrument-text" th:text="${report.limitations}"></dd></dl><p th:if="${report.revision > 1}"><span th:text="#{luthier.correctionReason}"></span>: <span th:text="${report.correctionReason}"></span></p><div th:replace="~{report-documents :: attachments(${report}, ${reportDocuments[report.id]}, ${false})}"></div></article>
</section></body></html>
