<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="content" class="vault luthier-page shop-page">
<a th:href="@{/shop-conversations}" th:text="#{shop.conversations}"></a><header class="page-header"><div><h1 th:text="${conversation.title}"></h1><p th:text="${conversation.shop.name}"></p></div><p class="badge" th:text="${#messages.msg('appointment.status.' + conversation.status)}"></p></header><p class="notice" th:text="#{shop.private}"></p><p th:if="${error}" class="notice error" role="alert" th:text="${#messages.msg(error)}"></p>
<section class="panel" th:if="${conversation.listingTitle != null}"><h2 th:text="${conversation.listingTitle}"></h2><p th:text="${conversation.askingPrice + ' ' + conversation.currency}"></p><p th:text="#{shop.snapshotHint}"></p></section>
<section class="panel" th:if="${conversation.scheduled}"><h2 th:text="#{appointment.latestTime}"></h2><p><time th:text="${#temporals.format(conversation.proposedLocal, 'dd/MM/yyyy HH:mm')}"></time> <span th:text="${conversation.timeZone}"></span></p><p th:text="#{shop.bookingHint}"></p><div class="actions" th:if="${canRespond}"><form th:each="action : ${ {'confirm','decline'} }" method="post" th:action="@{/shop-conversations/{id}/{action}(id=${conversation.id},action=${action})}"><input type="hidden" name="version" th:value="${conversation.version}"><button class="button" type="submit" th:text="${#messages.msg('appointment.' + action)}"></button></form></div></section>
<section class="panel"><h2 th:text="#{appointment.conversation}"></h2><article class="appointment-message" th:each="entry : ${messages}"><p><strong th:text="${entry.author.username}"></strong> · <time th:text="${#temporals.format(entry.createdDateTime, 'dd/MM/yyyy HH:mm') + ' UTC'}"></time></p><p th:text="${#messages.msg('appointment.event.' + entry.kind)}"></p><p th:if="${entry.proposedAt != null}"><time th:text="${#temporals.format(entry.proposedLocal, 'dd/MM/yyyy HH:mm')}"></time> <span th:text="${entry.timeZone}"></span></p><p class="instrument-text" th:text="${entry.body}"></p></article></section>
<form class="panel" th:if="${conversation.open}" method="post" th:action="@{/shop-conversations/{id}/messages(id=${conversation.id})}"><input type="hidden" name="version" th:value="${conversation.version}"><label for="shop-reply" th:text="#{appointment.reply}"></label><textarea id="shop-reply" name="message" required rows="3" maxlength="2000" th:text="${form['message']}"></textarea><button class="button" type="submit" th:text="#{appointment.sendReply}"></button></form>
<form class="panel" th:if="${conversation.status.name() == 'PENDING'}" method="post" th:action="@{/shop-conversations/{id}/proposals(id=${conversation.id})}"><h2 th:text="#{appointment.propose}"></h2><input type="hidden" name="version" th:value="${conversation.version}"><div th:replace="~{shop-time :: fields}"></div><label for="shop-proposal-message" th:text="#{appointment.message}"></label><textarea id="shop-proposal-message" name="message" required maxlength="2000" rows="3" th:text="${form['message']}"></textarea><button class="button" type="submit" th:text="#{appointment.sendProposal}"></button></form>
<form class="panel" th:if="${conversation.open}" method="post" th:action="@{/shop-conversations/{id}/cancel(id=${conversation.id})}"><input type="hidden" name="version" th:value="${conversation.version}"><button class="button secondary-button" type="submit" th:text="#{appointment.cancel}"></button></form>
</section></body></html>
