<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="content" class="vault"><header class="page-header"><h1 th:text="#{report.moderation}"></h1></header><form method="get" th:action="@{/admin/moderation}" class="panel report-filter"><label for="moderation-state" th:text="#{report.state}"></label><select id="moderation-state" name="state"><option value="OPEN" th:selected="${state == 'OPEN'}" th:text="#{report.status.OPEN}"></option><option value="IN_REVIEW" th:selected="${state == 'IN_REVIEW'}" th:text="#{report.status.IN_REVIEW}"></option><option value="CLOSED" th:selected="${state == 'CLOSED'}" th:text="#{report.status.CLOSED}"></option><option value="ALL" th:selected="${state == 'ALL'}" th:text="#{notification.all}"></option></select><button class="button" th:text="#{calendar.go}"></button></form><p class="panel muted" th:if="${reportPage.empty}" th:text="#{report.emptyQueue}"></p><ul class="report-list"><li class="panel report-row" th:each="report : ${reportPage.content}"><div><a th:href="@{/admin/moderation/reports/{id}(id=${report.id})}" th:text="${report.targetLabel}"></a><p class="muted"><span th:text="${#messages.msg('report.target.' + report.targetType)}"></span> · <span th:text="${#messages.msg('report.reason.' + report.reason)}"></span></p></div><span class="badge" th:text="${#messages.msg('report.status.' + report.status)}"></span></li></ul><nav class="article-pagination" th:if="${reportPage.totalPages > 1}" th:aria-label="#{report.pages}"><a th:if="${reportPage.hasPrevious()}" th:href="@{/admin/moderation(page=${reportPage.number - 1},state=${state})}" th:text="#{notification.previous}"></a><span th:text="#{notification.page(${reportPage.number + 1},${reportPage.totalPages})}"></span><a th:if="${reportPage.hasNext()}" th:href="@{/admin/moderation(page=${reportPage.number + 1},state=${state})}" th:text="#{notification.next}"></a></nav></section>
</body></html>
