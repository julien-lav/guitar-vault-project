<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><title th:text="#{page.home}">Guitar Vault</title></head><body>
<section th:fragment="content" class="vault recovery" aria-labelledby="forgot-title">
    <p class="eyebrow">GUITAR VAULT</p>
    <h1 id="forgot-title" th:text="#{forgot.heading}"></h1>
    <p class="muted" th:text="#{forgot.intro}"></p>
    <div th:if="${success}" class="notice success" role="status" th:text="${#messages.msg(success)}"></div>
    <form method="post" th:action="@{/forgot-password}" class="panel">
        <label for="email" th:text="#{field.email}"></label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" th:value="${email}" required />
        <button class="button" type="submit" th:text="${success != null ? #messages.msg('forgot.resend') : #messages.msg('forgot.submit')}"></button>
    </form>
    <p class="muted" th:if="${success}" th:text="#{mail.resendWait}"></p>
    <p><a th:href="@{/resend-verification}" th:text="#{resend.link}"></a></p>
    <p><a th:href="@{/login}" th:text="#{forgot.back}"></a></p>
</section>
</body></html>
