<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="content" class="vault luthier-page">
<a th:href="@{/interventions/{id}(id=${report.intervention.id})}" th:text="#{luthier.intervention}"></a><header class="page-header"><h1 th:text="#{document.attach}"></h1></header><p><span th:text="${report.workshopName}"></span> · <span th:text="#{luthier.revision}"></span> <span th:text="${report.revision}"></span></p><p class="notice" th:text="#{document.attachmentHint}"></p><div class="notice error" role="alert" th:if="${error}" th:text="${#messages.msg(error)}"></div><div class="notice error" role="alert" th:if="${documentError}" th:text="${#messages.msg(documentError)}"></div><p class="notice success" role="status" th:if="${documentSuccess}" th:text="${#messages.msg(documentSuccess)}"></p><form class="panel" method="post" enctype="multipart/form-data" th:action="@{/assessments/{id}/attachments(id=${report.id})}"><div class="fields"><div class="field-wide"><label for="document-title" th:text="#{document.label}"></label><input id="document-title" name="title" required maxlength="150" th:value="${documentTitle}"></div><div class="field-wide"><label for="document-file" th:text="#{document.file}"></label><input id="document-file" type="file" name="file" accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png" required aria-describedby="document-file-hint"><p id="document-file-hint" class="field-hint" th:text="#{document.fileHint}"></p></div><div class="field-wide"><label for="document-visibility" th:text="#{document.visibility}"></label><select id="document-visibility" name="visibility"><option th:each="scope : ${ {'PRIVATE','REQUEST','REPORT'} }" th:value="${scope}" th:selected="${documentVisibility == scope}" th:text="${#messages.msg('document.visibility.' + scope)}"></option></select></div></div><button class="button" type="submit" th:text="#{document.upload}"></button></form>
</section></body></html>
