<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="content" class="vault luthier-page document-library">
<a th:href="@{/documents}" th:text="#{document.mine}"></a><header class="page-header"><div><h1 th:text="#{document.library.manage}"></h1><p th:text="${document.title}"></p></div><a th:href="@{/documents/{id}/download(id=${document.id})}" th:text="#{document.library.download}"></a></header><div class="notice error" role="alert" th:if="${error}" th:text="${#messages.msg(error)}"></div><div class="notice error" role="alert" th:if="${documentError}" th:text="${#messages.msg(documentError)}"></div><p class="notice success" role="status" th:if="${documentSuccess}" th:text="${#messages.msg(documentSuccess)}"></p><p class="notice" th:text="#{document.library.labelHint}"></p><section class="panel"><p><strong th:text="#{document.library.original}"></strong>: <span th:text="${document.originalTitle}"></span> · <span th:text="${#messages.msg('document.kind.' + document.originalKind)}"></span></p><p th:text="${document.filename}"></p><p th:text="${document.instrumentName}"></p><p th:text="${#messages.msg('document.library.access.' + document.access)}"></p></section><form class="panel" method="post" th:action="@{/documents/{id}/labels(id=${document.id})}"><input type="hidden" name="version" th:value="${formVersion}"><div class="fields"><div class="field-wide"><label for="library-title" th:text="#{document.label}"></label><input id="library-title" name="title" required maxlength="150" th:value="${formTitle}"></div><div><label for="edit-category" th:text="#{document.category}"></label><select id="edit-category" name="category"><option th:each="kind : ${categories}" th:value="${kind}" th:selected="${formCategory == kind.name()}" th:text="${#messages.msg('document.kind.' + kind)}"></option></select></div></div><button class="button" type="submit" th:text="#{document.library.save}"></button></form><section class="panel"><h2 th:text="${#messages.msg(document.archived ? 'document.library.state.ARCHIVED' : 'document.library.state.ACTIVE')}"></h2><p th:text="#{document.library.archiveHint}"></p><form method="post" th:action="@{/documents/{id}/archive(id=${document.id})}"><input type="hidden" name="version" th:value="${document.version}"><input type="hidden" name="archived" th:value="${!document.archived}"><button class="button secondary-button" type="submit" th:text="${#messages.msg(document.archived ? 'document.library.restore' : 'document.library.archive')}"></button></form></section><section class="panel"><h2 th:text="#{document.library.delete}"></h2><p th:text="#{document.library.deleteHint}"></p><a class="danger-link" th:if="${document.canDelete}" th:href="@{/documents/{id}/delete(id=${document.id})}" th:text="#{document.library.delete}"></a><p th:unless="${document.canDelete}" th:text="#{document.library.retained}"></p></section>
</section></body></html>
