<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="content" class="vault wishlist-editor" aria-labelledby="wishlist-form-title">
    <a th:href="@{/wishlist}" th:text="#{wishlist.back}"></a>
    <header class="page-header">
        <div>
            <p class="eyebrow" th:text="#{wishlist.label}"></p>
            <h1 id="wishlist-form-title" th:text="${#messages.msg(title)}"></h1>
            <p class="muted" th:text="#{wishlist.formIntro}"></p>
        </div>
    </header>
    <div th:if="${error}" class="notice error" role="alert" tabindex="-1" data-form-error th:text="${#messages.msg(error)}"></div>
    <form class="panel" method="post" th:action="${itemId == null ? '/wishlist' : '/wishlist/' + itemId}">
        <div class="fields">
            <div>
                <label for="name" th:text="#{field.model}"></label>
                <input id="name" name="name" required maxlength="100" th:value="${form['name']}" th:placeholder="#{instrument.modelPlaceholder}">
            </div>
            <div>
                <label for="brand" th:text="#{field.brand}"></label>
                <input id="brand" name="brand" required maxlength="100" th:value="${form['brand']}" th:placeholder="#{instrument.brandPlaceholder}">
            </div>
            <div>
                <label for="year"><span th:text="#{field.year}"></span> <span th:text="#{common.optional}"></span></label>
                <input id="year" name="year" type="number" min="1" th:max="${currentYear}" th:value="${form['year']}">
            </div>
            <div class="field-wide">
                <label for="notes"><span th:text="#{instrument.notes}"></span> <span th:text="#{common.optional}"></span></label>
                <textarea id="notes" name="notes" rows="5" maxlength="5000" th:text="${form['notes']}" th:placeholder="#{wishlist.notesPlaceholder}"></textarea>
            </div>
        </div>
        <div class="actions">
            <button class="button" type="submit" th:text="#{wishlist.save}"></button>
            <a th:href="@{/wishlist}" th:text="#{common.cancel}"></a>
        </div>
    </form>
</section>
</body>
</html>
