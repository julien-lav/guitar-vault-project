<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><body>
<button th:fragment="toggle(field)" type="button" class="password-toggle" th:data-target="${field}"
        th:aria-controls="${field}" aria-pressed="false" th:aria-label="#{password.show}"
        th:title="#{password.show}" th:data-show="#{password.show}" th:data-hide="#{password.hide}" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
        <circle cx="12" cy="12" r="3" />
        <path class="eye-slash" d="m3 3 18 18" />
    </svg>
</button>
</body></html>
