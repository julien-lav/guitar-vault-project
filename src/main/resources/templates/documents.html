<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="content" class="vault luthier-page document-library">
<header class="page-header"><h1 th:text="#{document.mine}"></h1><a th:href="@{/instruments}" th:text="#{nav.instruments}"></a></header><p class="notice" th:text="#{document.library.intro}"></p><div class="notice error" role="alert" th:if="${error}" th:text="${#messages.msg(error)}"></div><div class="notice error" role="alert" th:if="${documentError}" th:text="${#messages.msg(documentError)}"></div><p class="notice success" role="status" th:if="${documentSuccess}" th:text="${#messages.msg(documentSuccess)}"></p><form class="panel library-filters" method="get" th:action="@{/documents}"><div class="fields"><div class="field-wide"><label for="document-query" th:text="#{document.library.search}"></label><input id="document-query" name="q" maxlength="200" th:value="${filters.query}"></div><div><label for="library-instrument" th:text="#{document.library.instrument}"></label><select id="library-instrument" name="instrumentId"><option value="" th:text="#{document.library.allInstruments}"></option><option th:each="item : ${instrumentChoices}" th:value="${item.id}" th:selected="${filters.instrumentId == item.id}" th:text="${item.name}"></option></select></div><div><label for="library-category" th:text="#{document.category}"></label><select id="library-category" name="category"><option value="" th:text="#{document.library.allCategories}"></option><option th:each="kind : ${categories}" th:value="${kind}" th:selected="${filters.category == kind}" th:text="${#messages.msg('document.kind.' + kind)}"></option></select></div><div><label for="library-access" th:text="#{document.library.accessLabel}"></label><select id="library-access" name="access"><option value="" th:text="#{document.library.allAccess}"></option><option th:each="access : ${accessLevels}" th:value="${access}" th:selected="${filters.access == access}" th:text="${#messages.msg('document.library.access.' + access)}"></option></select></div><div><label for="library-state" th:text="#{document.library.stateLabel}"></label><select id="library-state" name="state"><option th:each="state : ${states}" th:value="${state}" th:selected="${filters.state == state}" th:text="${#messages.msg('document.library.state.' + state)}"></option></select></div></div><div class="actions"><button class="button" type="submit" th:text="#{document.library.filter}"></button><a th:href="@{/documents}" th:text="#{document.library.reset}"></a></div></form><section class="panel"><p role="status" th:text="#{document.library.count(${documentPage.totalElements})}"></p><ul class="document-list library-list"><li th:each="doc : ${documents}"><div class="library-row-heading"><a th:href="@{/documents/{id}/download(id=${doc.id})}" th:text="${doc.title}"></a><a class="secondary-button" th:href="@{/documents/{id}/manage(id=${doc.id})}" th:text="#{document.library.manage}"></a></div><p class="muted"><span th:text="${doc.instrumentName}"></span> · <span th:text="${#messages.msg('document.kind.' + doc.kind)}"></span> · <span th:text="${doc.filename}"></span> · <span th:text="${doc.byteSize}"></span> <span th:text="#{document.bytes}"></span></p><p class="field-hint"><span th:text="${#messages.msg('document.library.access.' + doc.access)}"></span> · <span th:text="${#messages.msg(doc.archived ? 'document.library.state.ARCHIVED' : 'document.library.state.ACTIVE')}"></span></p><p class="field-hint" th:if="${doc.customLabels}"><span th:text="#{document.library.original}"></span>: <span th:text="${doc.originalTitle}"></span></p></li></ul><p th:if="${#lists.isEmpty(documents)}" th:text="#{document.library.noResults}"></p><nav class="actions" th:if="${documentPage.totalPages > 1}" th:aria-label="#{document.library.pagination}"><a th:if="${documentPage.hasPrevious()}" th:href="@{/documents(q=${filters.query},instrumentId=${filters.instrumentId},category=${filters.category},access=${filters.access},state=${filters.state},page=${documentPage.number - 1})}" th:text="#{document.library.previous}"></a><span th:text="#{document.library.page(${documentPage.number + 1},${documentPage.totalPages})}"></span><a th:if="${documentPage.hasNext()}" th:href="@{/documents(q=${filters.query},instrumentId=${filters.instrumentId},category=${filters.category},access=${filters.access},state=${filters.state},page=${documentPage.number + 1})}" th:text="#{document.library.next}"></a></nav></section>
</section></body></html>
