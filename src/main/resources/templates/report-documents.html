<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="attachments(report, files, canAttach)" class="report-attachments"><h3 th:text="#{document.attachments}"></h3><ul class="document-list"><li th:each="doc : ${files}"><a th:href="@{/documents/{id}/download(id=${doc.id})}" th:text="${doc.title}"></a><p class="field-hint"><span th:text="${#messages.msg('document.visibility.' + doc.visibility)}"></span> · <time th:text="${doc.uploadedAt}"></time></p></li></ul><p th:if="${#lists.isEmpty(files)}" th:text="#{document.noAttachments}"></p><a th:if="${canAttach}" th:href="@{/assessments/{id}/attachments/new(id=${report.id})}" th:text="#{document.attach}"></a></section></body></html>
