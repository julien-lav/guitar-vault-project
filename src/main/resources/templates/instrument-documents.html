<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="content" class="vault luthier-page">
<a th:href="@{/instruments/{id}(id=${instrument.id})}" th:text="${instrument.name}"></a><header class="page-header"><h1 th:text="#{document.title}"></h1><a th:href="@{/documents}" th:text="#{document.mine}"></a></header><p class="notice" th:text="#{document.privateHint}"></p><p><a th:href="@{/documents(instrumentId=${instrument.id})}" th:text="#{document.library.filteredLibrary}"></a></p><div class="notice error" role="alert" th:if="${error}" th:text="${#messages.msg(error)}"></div><div class="notice error" role="alert" th:if="${documentError}" th:text="${#messages.msg(documentError)}"></div><p class="notice success" role="status" th:if="${documentSuccess}" th:text="${#messages.msg(documentSuccess)}"></p><section class="panel"><ul class="document-list library-list"><li th:each="doc : ${documents}"><div class="library-row-heading"><a th:href="@{/documents/{id}/download(id=${doc.id})}" th:text="${doc.title}"></a><a class="secondary-button" th:href="@{/documents/{id}/manage(id=${doc.id})}" th:text="#{document.library.manage}"></a></div><p class="muted"><span th:text="${doc.instrumentName}"></span> · <span th:text="${#messages.msg('document.kind.' + doc.kind)}"></span> · <span th:text="${doc.filename}"></span> · <span th:text="${doc.byteSize}"></span> <span th:text="#{document.bytes}"></span></p><p class="field-hint"><span th:text="${#messages.msg('document.library.access.' + doc.access)}"></span> · <span th:text="${#messages.msg(doc.archived ? 'document.library.state.ARCHIVED' : 'document.library.state.ACTIVE')}"></span></p><p class="field-hint" th:if="${doc.customLabels}"><span th:text="#{document.library.original}"></span>: <span th:text="${doc.originalTitle}"></span></p></li></ul><p th:if="${#lists.isEmpty(documents)}" th:text="#{document.library.noResults}"></p></section><form class="panel" method="post" enctype="multipart/form-data" th:action="@{/instruments/{id}/documents(id=${instrument.id})}"><h2 th:text="#{document.upload}"></h2><div class="fields"><div class="field-wide"><label for="document-title" th:text="#{document.label}"></label><input id="document-title" name="title" required maxlength="150" th:value="${documentTitle}"></div><div class="field-wide"><label for="document-file" th:text="#{document.file}"></label><input id="document-file" type="file" name="file" accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png" required aria-describedby="document-file-hint"><p id="document-file-hint" class="field-hint" th:text="#{document.fileHint}"></p></div><div><label for="document-kind" th:text="#{document.category}"></label><select id="document-kind" name="kind"><option th:each="kind : ${kinds}" th:value="${kind}" th:selected="${documentKind == kind.name()}" th:text="${#messages.msg('document.kind.' + kind)}"></option></select></div></div><button class="button" type="submit" th:text="#{document.upload}"></button></form>
</section></body></html>
