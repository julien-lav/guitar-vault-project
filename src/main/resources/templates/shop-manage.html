<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="content" class="vault luthier-page shop-page">
<header class="page-header"><h1 th:text="#{shop.mine}"></h1><a th:href="@{/shops}" th:text="#{shop.directory}"></a></header><p th:if="${error}" class="notice error" role="alert" th:text="${#messages.msg(error)}"></p>
<section class="panel"><h2 th:text="#{shop.profile}"></h2><p th:text="#{shop.publishHint}"></p><form method="post" th:action="@{/my-shop}"><input type="hidden" name="version" th:value="${form['version']}"><div class="fields">
<div><label for="shop-name" th:text="#{shop.name}"></label><input id="shop-name" name="name" maxlength="150" required th:value="${form['name']}"></div><div><label for="shop-location" th:text="#{shop.location}"></label><input id="shop-location" name="location" maxlength="200" required th:value="${form['location']}"></div></div>
<label for="shop-description" th:text="#{shop.description}"></label><textarea id="shop-description" name="description" rows="4" maxlength="3000" required th:text="${form['description']}"></textarea>
<label for="shop-contact" th:text="#{shop.publicContact}"></label><input id="shop-contact" name="contact" maxlength="300" required th:value="${form['contact']}">
<label for="shop-hours" th:text="#{shop.hours}"></label><textarea id="shop-hours" name="openingHours" rows="2" maxlength="500" required th:text="${form['openingHours']}"></textarea>
<label class="workshop-publish"><input type="checkbox" name="published" value="true" th:checked="${form['published'] == 'true'}"><span th:text="#{shop.publish}"></span></label><button class="button" type="submit" th:text="#{shop.save}"></button></form></section>
<section class="panel" th:if="${shop != null}"><h2 th:text="#{shop.inventory}"></h2><div class="actions"><a class="button" th:href="@{/my-shop/listings/new}" th:text="#{shop.addInstrument}"></a><a th:if="${shop.published}" th:href="@{/shops/{id}(id=${shop.id})}" th:text="#{shop.view}"></a><a th:href="@{/shop-conversations}" th:text="#{shop.conversations}"></a></div><p th:if="${listingPage.empty}" th:text="#{shop.noStock}"></p>
<article class="shop-stock-row" th:each="item : ${listingPage.content}"><h3><a th:href="@{/my-shop/listings/{id}/edit(id=${item.id})}" th:text="${item.title}"></a></h3><p><span th:text="${item.price + ' ' + item.currency}"></span> · <span th:text="${#messages.msg('shop.stock.' + item.stock)}"></span> · <span th:text="${#messages.msg(item.published ? 'shop.published' : 'shop.draft')}"></span></p><a th:if="${item.instrument.owner.id == shop.user.id}" th:href="@{/instruments/{id}(id=${item.instrument.id})}" th:text="#{shop.passport}"></a><p th:unless="${item.instrument.owner.id == shop.user.id}" th:text="#{shop.transferred}"></p></article>
<div class="actions"><a th:if="${listingPage.hasPrevious()}" th:href="@{/my-shop(page=${listingPage.number - 1})}" th:text="#{notification.previous}"></a><a th:if="${listingPage.hasNext()}" th:href="@{/my-shop(page=${listingPage.number + 1})}" th:text="#{notification.next}"></a></div></section>
</section></body></html>
