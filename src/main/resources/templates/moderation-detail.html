<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="content" class="vault moderation-detail"><a th:href="@{/admin/moderation}" th:text="#{report.moderation}"></a><header class="page-header"><div><h1 th:text="${report.targetLabel}"></h1><p><span class="badge" th:text="${#messages.msg('report.status.' + report.status)}"></span></p></div></header><div th:if="${success}" class="notice success" role="status" th:text="${#messages.msg(success)}"></div><div th:if="${error}" class="notice error" role="alert" th:text="${#messages.msg(error)}"></div>
<section class="panel band-section"><h2 th:text="#{report.detail}"></h2><dl class="profile-facts"><dt th:text="#{report.reporter}"></dt><dd th:text="${report.reporter.username}"></dd><dt th:text="#{report.reason}"></dt><dd th:text="${#messages.msg('report.reason.' + report.reason)}"></dd><dt th:text="#{report.created}"></dt><dd th:text="${#temporals.format(report.createdDateTime, 'dd/MM/yyyy HH:mm') + ' UTC'}"></dd><dt th:text="#{report.decision}"></dt><dd th:text="${#messages.msg('report.decision.' + report.decision)}"></dd></dl><p class="instrument-text" th:text="${report.explanation}"></p></section>
<section class="panel band-section"><h2 th:text="#{report.snapshot}"></h2><p class="instrument-text moderation-snapshot" th:text="${report.snapshot}"></p></section>
<section class="panel band-section"><h2 th:text="#{report.currentContent}"></h2><div th:if="${currentTarget != null}"><p class="badge" th:text="${currentTarget.hidden() ? #messages.msg('report.hidden') : #messages.msg('report.visible')}"></p><p class="instrument-text moderation-snapshot" th:text="${currentTarget.text()}"></p><a th:if="${!currentTarget.hidden()}" th:href="${currentTarget.url()}" th:text="#{report.openContent}"></a></div><p th:if="${currentTarget == null}" th:text="#{report.unavailable}"></p><div class="moderation-media"><img th:each="mediaId : ${mediaIds}" th:src="@{/admin/moderation/reports/{id}/media/{mediaId}(id=${report.id},mediaId=${mediaId})}" th:alt="#{report.currentImage}" loading="lazy"></div></section>
<section class="panel band-section"><h2 th:text="#{report.process}"></h2><form method="post" th:action="@{/admin/moderation/reports/{id}/action(id=${report.id})}"><div class="fields"><div><label for="moderation-action" th:text="#{report.action}"></label><select id="moderation-action" name="action" required><option th:if="${report.status.name() != 'CLOSED'}" value="REVIEW" th:text="#{report.action.REVIEW}"></option><option th:if="${report.status.name() != 'CLOSED'}" value="DISMISS" th:text="#{report.action.DISMISS}"></option><option th:if="${currentTarget != null and !currentTarget.hidden()}" value="HIDE" th:text="#{report.action.HIDE}"></option><option th:if="${currentTarget != null and currentTarget.hidden()}" value="RESTORE" th:text="#{report.action.RESTORE}"></option></select></div><div class="field-wide"><label for="moderation-note" th:text="#{report.internalNote}"></label><textarea id="moderation-note" name="note" required maxlength="2000" rows="4" th:text="${moderatorNote}"></textarea></div></div><button class="button" th:text="#{report.apply}"></button></form></section>
<section th:if="${superAdmin}" class="panel band-section"><h2 th:text="#{report.accountActions}"></h2><p><span th:text="${report.owner.username}"></span> · <strong th:text="${report.owner.suspended ? #messages.msg('report.suspended') : #messages.msg('report.notSuspended')}"></strong></p><p class="field-hint" th:text="#{report.accountHint}"></p><form method="post" th:action="@{/admin/moderation/reports/{id}/account/suspend(id=${report.id})}"><label for="account-note" th:text="#{report.internalNote}"></label><textarea id="account-note" name="note" required rows="4" maxlength="2000"></textarea><div class="actions"><button th:unless="${report.owner.suspended}" class="button danger-button" th:text="#{report.action.SUSPEND}"></button><button th:if="${report.owner.suspended}" class="button" th:formaction="@{/admin/moderation/reports/{id}/account/reactivate(id=${report.id})}" th:text="#{report.action.REACTIVATE}"></button></div></form></section>
<section class="panel"><h2 th:text="#{report.audit}"></h2><p class="muted" th:if="${#lists.isEmpty(audit)}" th:text="#{report.noAudit}"></p><ol class="report-audit"><li th:each="entry : ${audit}"><p><strong th:text="${#messages.msg('report.action.' + entry.action)}"></strong> · <span th:text="${entry.actor.username}"></span> · <time th:text="${#temporals.format(entry.createdDateTime, 'dd/MM/yyyy HH:mm') + ' UTC'}"></time></p><p class="instrument-text" th:text="${entry.note}"></p></li></ol></section>
</section>
</body></html>
