<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Instruments</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f4f6;
            color: #111827;
        }
        nav {
            background: #111827;
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 16px;
            font-weight: bold;
        }
        .container {
            padding: 32px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            padding: 12px;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            background: #dbeafe;
            color: #1d4ed8;
            font-weight: bold;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <nav>
        <div>
            <a href="/">Guitar Vault</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/instruments">Instruments</a>
            <a href="/profile">Profil</a>
        </div>
        <div>
            <a href="/login">Login</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h1 th:text="${title}">Mes instruments</h1>

            <table>
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Marque</th>
                        <th>Année</th>
                        <th>Propriétaire</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="instrument : ${instruments}">
                        <td th:text="${instrument.name}">Nom</td>
                        <td th:text="${instrument.brand}">Marque</td>
                        <td th:text="${instrument.year}">Année</td>
                        <td th:text="${instrument.owner}">Propriétaire</td>
                        <td><span class="badge" th:text="${instrument.status}">Statut</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
