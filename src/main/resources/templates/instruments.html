<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title th:text="#{nav.instruments}">Mes instruments</title></head>
<body>
<section th:fragment="content" class="vault" aria-labelledby="instruments-title">
    <header class="page-header">
        <div>
            <p class="eyebrow" th:text="#{collection.label}">Ma collection</p>
            <h1 id="instruments-title" th:text="#{nav.instruments}">Mes instruments</h1>
            <p class="muted" th:text="#{collection.count(${#lists.size(instruments)})}"></p>
        </div>
        <a class="button" th:href="@{/instruments/new}" th:text="#{instrument.add}">+ Ajouter un instrument</a>
    </header>
    <div class="panel"><div th:replace="~{instruments :: collection}"></div></div>
</section>
<div th:fragment="collection">
    <div class="empty" th:if="${#lists.isEmpty(instruments)}">
        <div class="empty-icon" aria-hidden="true">♫</div>
        <h2 th:text="#{collection.emptyTitle}">Votre collection commence ici</h2>
        <p class="muted"><span th:text="#{collection.emptyText}">Vous n’avez pas encore d’instrument enregistré.</span><br><span th:text="#{collection.emptyHint}">Ajoutez le premier pour le retrouver dans votre espace.</span></p>
        <a class="button" th:href="@{/instruments/new}" th:text="#{collection.first}">Ajouter mon premier instrument</a>
    </div>
    <div class="table-scroll" th:unless="${#lists.isEmpty(instruments)}">
        <table th:aria-label="#{nav.instruments}">
            <thead><tr><th scope="col" th:text="#{field.instrumentName}">Instrument</th><th scope="col" th:text="#{field.brand}">Marque</th><th scope="col" th:text="#{field.year}">Année</th><th scope="col" th:text="#{field.status}">Statut</th></tr></thead>
            <tbody>
                <tr th:each="instrument : ${instruments}">
                    <td><strong th:text="${instrument.name}"></strong></td>
                    <td th:text="${instrument.brand}"></td>
                    <td th:text="${instrument.year != null ? instrument.year : #messages.msg('instrument.unknownYear')}"></td>
                    <td><span class="badge" th:classappend="${instrument.status == 'À réparer' ? 'repair' : (instrument.status == 'En vente' ? 'sale' : '')}" th:text="${#messages.msg(optionKeys.get(instrument.status))}"></span></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
