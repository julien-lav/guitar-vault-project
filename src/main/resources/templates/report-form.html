<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="content" class="vault report-editor" aria-labelledby="report-form-title"><a th:href="${target.url()}" th:text="${target.label()}"></a><header class="page-header"><div><h1 id="report-form-title" th:text="#{report.create}"></h1><p class="muted" th:text="#{report.privacy}"></p></div></header><div th:if="${error}" class="notice error" role="alert" tabindex="-1" data-form-error th:text="${#messages.msg(error)}"></div><form class="panel" method="post" th:action="@{/reports}"><input type="hidden" name="type" th:value="${targetType}"><input type="hidden" name="targetId" th:value="${targetId}"><div class="fields"><div class="field-wide"><label for="report-reason" th:text="#{report.reason}"></label><select id="report-reason" name="reason" required><option value="" th:text="#{report.chooseReason}"></option><option th:each="reason : ${reasons}" th:value="${reason}" th:selected="${reason.name() == selectedReason}" th:text="${#messages.msg('report.reason.' + reason)}"></option></select></div><div class="field-wide"><label for="report-explanation" th:text="#{report.explanation}"></label><textarea id="report-explanation" name="explanation" rows="6" maxlength="2000" aria-describedby="report-explanation-help" th:text="${explanation}"></textarea><p id="report-explanation-help" class="field-hint" th:text="#{report.explanationHint}"></p></div></div><div class="actions"><button class="button" th:text="#{report.send}"></button><a th:href="${target.url()}" th:text="#{common.cancel}"></a></div></form></section>
</body></html>
