spring.application.name=guitar-vault
app.admin-emails=${APP_ADMIN_EMAILS:}
server.port=8081

# H2 (development) datasource
spring.datasource.url=jdbc:h2:file:./data/guitarvault;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mailpit configuration
spring.mail.host=localhost
spring.mail.port=11025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Use the public application URL in verification emails, never a request Host header.
app.base-url=${APP_BASE_URL:http://localhost:8081}
app.mail.from=${MAIL_FROM:Guitar Vault <no-reply@guitar-vault.local>}

# French is the default even when the host operating system uses English.
spring.messages.fallback-to-system-locale=false

# Instrument photo uploads (validated by the application).
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=30MB
